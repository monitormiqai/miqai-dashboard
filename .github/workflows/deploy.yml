name: Publish MIQAI Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public dashboard files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R assets src dist/
      - name: Upload the dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish the dashboard
        id: deployment
        uses: actions/deploy-pages@v4
